[package]
name = "indi"
version = "0.0.341"
edition = "2024"
description = "INDI protocol client library"
repository = "https://github.com/art-den/astra_lite"
license = "MIT"

[lib]
name = "indi"
path = "src/lib.rs"

[dependencies]
bitflags = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
eyre = "0.6"
itertools = "0.10"
log = "0.4"
once_cell = "1"
regex = "1.7"
thiserror = "1"
xmltree = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
unix-ancillary = "0.2"
